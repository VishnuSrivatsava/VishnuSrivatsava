name: generate contribution snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VishnuSrivatsava
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=tokyonight&color_snake=#8a7cff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8a7cff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
